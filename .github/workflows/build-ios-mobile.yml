name: 构建知萃 iOS 模拟器

on:
  push:
    branches: ['codex/ios-mobile-client']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖与验证
        run: |
          npm ci
          npm run test:ios
          npm run test:desktop-login
          npm run test:navigation
          npm run test:file-export
      - name: 构建生产 Web 并同步 iOS
        env:
          NEXT_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run ios:build:prod
      - name: 编译无签名模拟器 App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
          test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent \
            ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app \
            ios/zhicui-ios-simulator.zip
      - name: 启动模拟器并安装运行
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE_ID" com.videocapsule.app
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot ios/ios-launch.png
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep com.videocapsule.app
          xcrun simctl terminate "$DEVICE_ID" com.videocapsule.app
          xcrun simctl shutdown "$DEVICE_ID"
      - name: 保存模拟器产物（不是 iPhone 安装包）
        uses: actions/upload-artifact@v4
        with:
          name: zhicui-ios-simulator-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/ios/zhicui-ios-simulator.zip
            frontend/ios/App/Podfile.lock
            frontend/ios/ios-launch.png
