name: Build Zhicui CLI Website Package
on:
  push:
    tags: ['cli-web-v*.*.*']
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: zhicui-cli-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and install dependencies
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "cli-web-v$(node -p "require('./package.json').version")"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          python -m pip install pydantic==2.13.4 pydantic-settings==2.14.2
          npm ci --registry=https://registry.npmjs.org
      - name: Test and audit immutable package
        run: |
          set -euo pipefail
          npm test
          mkdir -p ../release
          npm pack --ignore-scripts --pack-destination ../release --json > ../release/pack.json
          node scripts/audit-web-package.mjs ../release
          cp site/index.html site/site.css site/site.js ../release/
      - name: Attest package provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: release/zhicui-cli-*.tgz
      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zhicui-cli-web
          path: |
            release/zhicui-cli-*.tgz
            release/release.json
            release/SHA256SUMS
            release/index.html
            release/site.css
            release/site.js
          if-no-files-found: error
          retention-days: 30
