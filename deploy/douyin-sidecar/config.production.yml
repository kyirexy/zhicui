path: /opt/douyin-downloader/Metadata/

music: false
cover: false
avatar: false
json: false
folderstyle: true
group_by_mode: true
download_pinned: false

thread: 5
retry_times: 3
rate_limit: 2
proxy: ""
database: false

progress:
  quiet_logs: true

browser_fallback:
  enabled: true
  headless: false
  max_scrolls: 240
  idle_rounds: 8
  wait_timeout_seconds: 600

server:
  metadata_only: true
  login_browser_concurrency: 2
  max_jobs: 500
  job_ttl_seconds: 86400
