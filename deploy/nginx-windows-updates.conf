# Electron 更新清单必须每次回源；版本化安装包和差分文件可长期缓存。
# 旧版客户端继续读取 latest.yml；新版按 beta.yml / stable.yml 隔离。
location ~ ^/download/windows/(latest|beta|stable)\.yml$ {
    alias /var/lib/zhicui-downloads/windows/$1.yml;
    default_type text/yaml;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/download/releases/android/(beta|stable)\.json$ {
    alias /opt/zhicui-runtime/current/frontend/public/download/releases/android/$1.json;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # Capacitor Android serves the bundled app from https://localhost.  Keep
    # this origin exact so installed clients can read the public update feed
    # without turning the manifest endpoint into a wildcard CORS resource.
    add_header Access-Control-Allow-Origin "https://localhost" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Windows 清单与安装包必须一起落在持久目录，runtime 切版不得使更新源回退。
location ~ ^/download/releases/windows/(beta|stable)\.json$ {
    alias /var/lib/zhicui-downloads/releases/windows/$1.json;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /download/windows/Zhicui-Setup-latest-x64.exe {
    alias /var/lib/zhicui-downloads/windows/Zhicui-Setup-latest-x64.exe;
    default_type application/octet-stream;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /download/windows/ {
    alias /var/lib/zhicui-downloads/windows/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
