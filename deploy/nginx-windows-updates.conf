# Electron 更新清单必须每次回源；版本化安装包和差分文件可长期缓存。
location = /download/windows/latest.yml {
    alias /opt/zhicui/frontend/public/download/windows/latest.yml;
    default_type text/yaml;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /download/windows/Zhicui-Setup-latest-x64.exe {
    alias /opt/zhicui/frontend/public/download/windows/Zhicui-Setup-latest-x64.exe;
    default_type application/octet-stream;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /download/windows/ {
    alias /opt/zhicui/frontend/public/download/windows/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
