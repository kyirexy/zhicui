import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def releaseManifestFile = file('../../public/download/latest.json')
if (!releaseManifestFile.exists()) {
    throw new GradleException("Missing Android release manifest: ${releaseManifestFile}")
}

def releaseManifest = new JsonSlurper().parse(releaseManifestFile)
def releaseVersion = System.getenv('ZHICUI_ANDROID_VERSION') ?: releaseManifest.version?.toString()
def releaseBuildValue = System.getenv('ZHICUI_ANDROID_BUILD') ?: releaseManifest.build
def releaseBuild = releaseBuildValue instanceof Number
    ? releaseBuildValue.intValue()
    : releaseBuildValue?.toString()?.toInteger()
if (!releaseVersion || !(releaseBuild instanceof Number) || releaseBuild.intValue() < 1) {
    throw new GradleException('Android release manifest must contain a version and positive integer build')
}

def signingValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue
    }
    return project.findProperty(propertyName)?.toString()
}
def releaseKeystorePath = signingValue('ZHICUI_ANDROID_KEYSTORE_PATH', 'zhicuiReleaseKeystorePath')
def releaseKeystorePassword = signingValue('ZHICUI_ANDROID_KEYSTORE_PASSWORD', 'zhicuiReleaseKeystorePassword')
def releaseKeyAlias = signingValue('ZHICUI_ANDROID_KEY_ALIAS', 'zhicuiReleaseKeyAlias')
def releaseKeyPassword = signingValue('ZHICUI_ANDROID_KEY_PASSWORD', 'zhicuiReleaseKeyPassword')
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.videocapsule.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.videocapsule.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseBuild.intValue()
        versionName releaseVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsReleaseArtifact = graph.allTasks.any { task ->
        task.path == ':app:assembleRelease' ||
            task.path == ':app:bundleRelease' ||
            task.path.endsWith(':packageRelease')
    }
    if (requestsReleaseArtifact && !releaseSigningConfigured) {
        throw new GradleException(
            'Android Release 构建缺少 ZHICUI_ANDROID_KEYSTORE_PATH、' +
            'ZHICUI_ANDROID_KEYSTORE_PASSWORD、ZHICUI_ANDROID_KEY_ALIAS、' +
            'ZHICUI_ANDROID_KEY_PASSWORD。未输出任何秘密值。'
        )
    }
    if (releaseSigningConfigured && !file(releaseKeystorePath).isFile()) {
        throw new GradleException('Android Release keystore 路径不存在或不是文件')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
